name: Daily price report

on:
  schedule:
    - cron: "37 9 * * *"
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore previous price quotes
        uses: actions/cache/restore@v6
        with:
          path: price_cache.json
          key: price-quotes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            price-quotes-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check source parsers
        run: python -m unittest -q

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_bot.py report

      - name: Save latest price quotes
        if: always() && hashFiles('price_cache.json') != ''
        uses: actions/cache/save@v6
        with:
          path: price_cache.json
          key: price-quotes-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
